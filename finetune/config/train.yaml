# QLoRA SFT — tuned for a single 16 GB GPU (RTX 5080).
# Read by finetune.train.sft.TrainConfig.from_yaml.

method:
  name: "qlora"          # 4-bit NF4 base + LoRA

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

optim:
  learning_rate: 0.0001   # 1e-4
  weight_decay: 0.0
  scheduler: "cosine"
  warmup_ratio: 0.03

runtime:
  devices: 1
  batch_size: 1                       # per-device; 16 GB is tight at seq 4096
  gradient_accumulation_steps: 16     # effective batch 16
  max_seq_length: 4096
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  bf16: true
  packing: true

epochs: 3

eval:
  steps: 100          # run the Phase-D metrics on dev, not just loss
  save_steps: 200

seed: 0
