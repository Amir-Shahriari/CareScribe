# Synthetic-encounter datagen. Read by build_dataset (CLI flags override).
#
# Every key here changes the corpus. `test_datagen_config_is_live.py` fails on
# a key that does not, because nine of the twelve keys this file used to carry
# were read by nothing -- and a knob that does nothing is worse than a missing
# one: it survives review, and it makes a run's report describe settings that
# never applied. `styled_fraction: 0.30` reached an EVAL_REPORT as a
# `style_match` of 0.998, scoring a dimension that never varied.
#
# Removed 2026-09-10 because nothing read them. Re-add each WITH its wiring:
#   counts.train_target / dev_target / test_target
#       -- the split is by vignette, not by row count: `split_by_vignette`
#          holds out 10% of the *skeletons* for dev and 10% for test.
#   encounter_type_weights
#       -- encounter type comes from the vignette; weight the vignettes instead.
#   quality.styled_fraction
#       -- needs datagen/vignettes/styles/, which was never created. See D3 in
#          docs/superpowers/specs/2026-09-09-clinical-finetune-v2-design.md.
#   quality.polish_fraction / backend
#       -- build_dataset hardcodes the template backend; the ollama prose-polish
#          path is not wired into it.

rng:
  seed: 0

counts:
  total: 20000          # generate ~1.7x the target; validation drops the rest

quality:
  gap_probability: 0.25    # chance a gappable field is blanked -> "Not documented."

# Relative weight per specialty (vignette weights still apply within each).
# Passed to sample_encounters. Every name must be a real vignette specialty.
specialty_weights:
  general practice: 1.4
  community mental health: 1.3
  cardiology: 1.0
  respiratory: 1.0
  elderly care: 1.0

# The output forms a training example may ask for. Must be FormType values.
form_types: ["soap", "progress_note", "handover", "care_plan"]
