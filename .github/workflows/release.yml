# Build and release the CareScribe desktop app.
#
# Trigger:  push a version tag (v1.2.3), or run manually from the Actions tab.
# Manual runs (workflow_dispatch) execute the two build jobs only — a way to
# confirm the PyInstaller freeze still works on clean runners without cutting a
# release. A tag push additionally creates a GitHub Release.
#
# CI builds are NOT code-signed, so the Release is created as a DRAFT: a human
# reviews the unsigned installers and the notes before publishing.
# The model is never bundled in CI (CARESCRIBE_BUNDLE_MODEL=0); the app fetches
# it once on first run.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - run: pip install -r packaging/requirements-build.txt --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
      - run: choco install innosetup --no-progress -y
      - name: Build Windows app + installer
        shell: pwsh
        env:
          CARESCRIBE_BUNDLE_MODEL: "0"
        run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CareScribeSetup-windows
          path: packaging/Output/CareScribeSetup.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m spacy download en_core_web_sm
      - run: pip install -r packaging/requirements-build.txt
      - name: Build macOS app + dmg
        env:
          CARESCRIBE_BUNDLE_MODEL: "0"
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CareScribe-macos
          path: dist/CareScribe.dmg
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/CareScribeSetup.exe
            artifacts/**/CareScribe.dmg
          draft: true
          generate_release_notes: true
